# Chimahon Custom: checks for direct pushes to the fork's branch.
#
# Upstream's build_pull_request.yml only runs on pull requests and release.yml only
# assembles, so nothing else tests a push here. This file is fork-owned and never
# conflicts with upstream.
#
# spotlessCheck is left out on purpose: it fails on upstream's own code in ten
# modules, so it cannot tell a new violation from an old one.
name: Custom checks
on:
  push:
    branches:
      - chimahon-custom
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fences and unit tests
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          # A nested hoshidicts submodule is declared with an SSH URL.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Check that fork changes in upstream files are fenced
        run: |
          git remote add upstream https://github.com/sohilsayed/chimahon.git
          git fetch --quiet upstream main
          python3 .github/scripts/custom_fence_audit.py --base "$(git merge-base HEAD upstream/main)"

      - name: Run lookup scanner and renderer tests
        run: node --test chimahon/src/test/js/*.test.mjs

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload test report
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/testReleaseUnitTest
            chimahon/build/reports/tests/testReleaseUnitTest
